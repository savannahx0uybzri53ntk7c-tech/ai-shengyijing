name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  diagram:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate semantic input
        run: python skills/html-story/scripts/diagram_compiler.py skills/html-story/examples/flow.json --check-only
      - name: Generate actual HTML fragment
        run: python skills/html-story/scripts/diagram_compiler.py skills/html-story/examples/flow.json --style humanist --form scroll --output /tmp/ai-shengyijing-diagram.html
